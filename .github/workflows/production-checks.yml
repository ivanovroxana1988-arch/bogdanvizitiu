name: Production checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint, typecheck, test, format and build
        run: npm run check

      - name: Show Prettier formatting diff (temporary diagnostic)
        if: failure()
        run: |
          npx prettier --write 'app/_views/insights/[slug]/page.tsx'
          git diff -- 'app/_views/insights/[slug]/page.tsx'
