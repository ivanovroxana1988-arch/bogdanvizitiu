name: Production checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show formatted AI leadership draft
        run: npx prettier "app/(ro)/cursuri/leadership-ai-draft/page.tsx"

      - name: Lint, typecheck, test, format and build
        run: npm run check
