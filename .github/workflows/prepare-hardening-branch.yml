name: Prepare hardening branch

on:
  push:
    branches: [agent/security-quality-hardening]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[prepared]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-quality-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund

      - name: Format source
        run: npm run format

      - name: Commit generated lockfile and formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app components lib tests scripts middleware.ts next.config.js package.json tsconfig.json tsconfig.test.json .github/workflows/production-checks.yml .eslintrc.json .prettierrc.json .prettierignore .gitignore .env.example
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Format source and add lockfile [prepared]"
          git push
